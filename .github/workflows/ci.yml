name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: 单元测试与覆盖率校验

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查测试文件重名
        run: |
          dups=$(find tests -name 'test_*.py' -printf '%f\n' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "发现重复测试文件名："
            for d in $dups; do
              echo "  $d"
              find tests -name "$d" -print
            done
            exit 1
          fi
          echo "无重复测试文件名"

      - name: 执行单元测试与覆盖率校验
        run: pytest
