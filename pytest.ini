[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
addopts = 
    -v
    --cov=common.compliance
    --cov=common.error_code
    --cov=common.yaml_reader
    --cov=common.config_loader
    --cov=common.sqlite_client
    --cov=core.batch_runner
    --cov=core.llm_client
    --cov=core.scorer
    --cov=core.statistics
    --cov=core.validator
    --cov=report.reporter
    --cov-report=term
    --cov-report=html:output/coverage
    --cov-fail-under=70

filterwarnings = ignore:.*pkg_resources is deprecated:DeprecationWarning
