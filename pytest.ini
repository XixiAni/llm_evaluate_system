[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
addopts = 
    -v
    --cov=common.compliance
    --cov=common.error_code
    --cov=common.yaml_reader
    --cov=core.scorer
    --cov=core.validator
    --cov-report=term
    --cov-report=html:output/coverage
    --cov-fail-under=70