# 合规校验敏感词库
sensitive_words:
  - "敏感词示例1"
  - "敏感词示例2"

# 有效性校验规则
validity:
  min_length: 5
  max_repeat_rate: 0.7

# 打分权重
score_weight:
  relevance: 0.4
  completeness: 0.3
  compliance: 0.3

# 幻觉检测规则
hallucination:
  # 低风险阈值：新增实词数量 ≤ 该值 判定为低风险
  low_risk_threshold: 3
  # 高风险阈值：新增实词数量 > 该值 判定为高风险
  high_risk_threshold: 6
  # 占比阈值，参与风险升档判定
  extra_ratio_threshold: 0.3
  # 白名单，不计入新增词统计
  whitelist:
    # 顺序过渡
    - "首先"
    - "其次"
    - "然后"
    - "最后"
    # 概括总结
    - "总体"
    - "总的来说"
    - "总之"
    - "总而言之"
    - "综上所述"
    # 概率修饰
    - "一般来说"
    - "通常"
    - "可能"
    - "也许"
    - "或许"
    # 补充递进
    - "此外"
    - "另外"
    - "从而"
    - "进而"
    # 同义转述
    - "换言之"
    - "也就是说"
    - "换句话说"
    - "概括来说"
    # 语气修正
    - "实际上"
    - "其实"
    - "简单来说"
    # 推导衔接
    - "由此可见"
    - "据此"
    - "故此"
    - "故而"
    # 介词衔接
    - "至于"
    - "关于"
    - "对于"
    - "根据"
    - "按照"
    - "经过"
    - "于是"
    # 情态衔接
    - "应该"
    - "应当"
    - "必须"
    - "需要"
    - "得以"
    - "以便"
    - "以免"
